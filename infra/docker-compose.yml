# Production stack (docs/10 §3). Usage:
#   cp infra/.env.example infra/.env   # fill every value
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
# Only Caddy publishes ports. Postgres and Redis live on an internal network with no host ports.

name: nx

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  DATABASE_URL: postgresql://${POSTGRES_USER:-nx}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-nx}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  NATIONAL_ID_PEPPER: ${NATIONAL_ID_PEPPER:?NATIONAL_ID_PEPPER is required}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nx}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory-policy noeviction']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes: [redisdata:/data]
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-off: apply migrations and the idempotent seed, then exit. api/worker wait for it.
  migrate:
    build: { context: .., dockerfile: infra/docker/Dockerfile, target: api }
    image: ${IMAGE_PREFIX:-nx}/api:${IMAGE_TAG:-latest}
    command: ['sh', '-c', 'node_modules/.bin/prisma migrate deploy && node dist/cli/seed.js']
    environment:
      <<: *api-env
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: 'no'
    logging: *logging

  api:
    image: ${IMAGE_PREFIX:-nx}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # `edge` gives outbound internet for provider calls (Moyasar, Resend, R2…) and reaches Caddy.
    networks: [backend, edge]
    <<: *hardening
    logging: *logging

  worker:
    image: ${IMAGE_PREFIX:-nx}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend, edge]
    <<: *hardening
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.exit(0)']
      interval: 30s
    logging: *logging

  # Static files are copied into volumes that Caddy serves read-only.
  frontend:
    build: { context: .., dockerfile: infra/docker/Dockerfile, target: frontend-static }
    image: ${IMAGE_PREFIX:-nx}/frontend:${IMAGE_TAG:-latest}
    volumes: [frontend_static:/target]
    network_mode: none
    restart: 'no'

  admin:
    build: { context: .., dockerfile: infra/docker/Dockerfile, target: admin-static }
    image: ${IMAGE_PREFIX:-nx}/admin:${IMAGE_TAG:-latest}
    volumes: [admin_static:/target]
    network_mode: none
    restart: 'no'

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CDN_ORIGIN: ${CDN_ORIGIN:-}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_static:/srv/frontend:ro
      - admin_static:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: { condition: service_completed_successfully }
      admin: { condition: service_completed_successfully }
      api: { condition: service_healthy }
    networks: [edge]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

networks:
  edge: {}
  backend:
    internal: true # Postgres and Redis: no route to or from the internet

volumes:
  pgdata: {}
  redisdata: {}
  caddy_data: {}
  caddy_config: {}
  frontend_static: {}
  admin_static: {}
