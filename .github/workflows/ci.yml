# CI (docs/10 §3): lint → test (with Postgres/Redis) → build images → push to GHCR (main only).
# Deployment itself is done by Coolify (or infra/scripts/deploy.sh on a plain VPS).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nx
          POSTGRES_PASSWORD: nx_ci_password
          POSTGRES_DB: nx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nx -d nx_test" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://nx:nx_ci_password@localhost:5432/nx_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared schema + Prisma client
        run: |
          pnpm --filter @nx/schema build
          pnpm --filter @nx/backend exec prisma generate
      - name: Generated frontend schema is up to date
        run: pnpm --filter @nx/schema check:frontend
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Prisma migrations match the schema
        run: |
          pnpm --filter @nx/backend exec prisma migrate deploy
          pnpm --filter @nx/backend exec prisma migrate diff --from-url "$TEST_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm test
      - run: pnpm --filter @nx/admin build
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high

  images:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, frontend-static, admin-static]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: |
          short="${{ matrix.target }}"; short="${short%-static}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nx-${short}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
