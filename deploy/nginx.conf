server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # لا تعرض ملفات التوثيق والإعداد الداخلية
    location ~* \.(md)$ { return 404; }
    location ~ /\. { deny all; }

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

    # روابط بدون امتداد: /about -> about.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # الصور والخطوط: كاش طويل
    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # CSS/JS: كاش قصير حتى تظهر التعديلات بسرعة
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # لاحقاً عند جاهزية الباك إند: فعّل هذا القسم وغيّر dataSource إلى 'api' في config.js
    # location /api/ {
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
