<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المفضلة — منزلة العقارية</title>
<meta name="theme-color" content="#0F4C3A">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div data-header></div>

<main id="main">
  <div class="container">
    <header class="page-head">
      <nav class="crumbs" aria-label="مسار التنقل"><a href="/">الرئيسية</a><span aria-hidden="true">/</span><span>المفضلة</span></nav>
      <h1 class="page-title">العقارات المحفوظة</h1>
      <p class="lead">العقارات التي حفظتها على هذا الجهاز. ستُحفظ في حسابك بعد إضافة تسجيل الدخول.</p>
    </header>
    <div class="grid-cards grid-cards--4" data-favs></div>
  </div>
</main>

<div data-footer></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/schema.js"></script>
<script src="data/properties.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function (MZ) {
  var ui = MZ.ui; ui.mount('');
  var el = document.querySelector('[data-favs]');
  function draw() {
    MZ.api.getMany(ui.fav.list()).then(function (items) {
      el.innerHTML = items.length ? items.map(function (p) { return ui.card(p); }).join('') :
        '<div class="empty" style="grid-column:1/-1">' + ui.icon('heart') + '<h3>لا توجد عقارات محفوظة بعد</h3><p>اضغط على أيقونة القلب في أي عقار لحفظه هنا والرجوع إليه لاحقاً.</p><a class="btn btn--primary" href="/properties">تصفّح العقارات</a></div>';
    });
  }
  document.addEventListener('mz:fav', draw);
  draw();
})(window.MZ);
</script>
</body>
</html>
