<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>العقارات — منزلة العقارية</title>
<meta name="description" content="ابحث في فلل وشقق وأراضٍ وعمائر وأبراج ومكاتب ومستودعات للبيع والإيجار والاستثمار مع فلاتر متقدمة وخريطة.">
<meta name="theme-color" content="#0F4C3A">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div data-header></div>

<main id="main">
  <div class="container">
    <header class="page-head">
      <nav class="crumbs" aria-label="مسار التنقل"><a href="/">الرئيسية</a><span aria-hidden="true">/</span><span data-crumb>العقارات</span></nav>
      <h1 class="page-title" data-title>كل العقارات</h1>
    </header>

    <div class="seg offer-tabs" role="group" aria-label="نوع العرض" data-offer-tabs>
      <button type="button" data-v="" aria-pressed="true">الكل</button>
      <button type="button" data-v="sale" aria-pressed="false">للبيع</button>
      <button type="button" data-v="rent" aria-pressed="false">للإيجار</button>
      <button type="button" data-v="investment" aria-pressed="false">للاستثمار</button>
    </div>

    <div class="list-layout" data-layout>
      <aside class="filters" data-filters aria-label="الفلاتر">
        <div class="filters__head">
          <h2><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>الفلاتر</h2>
          <div>
            <button class="textbtn" type="button" data-reset>مسح الكل</button>
            <button class="icon-btn filters__close" type="button" data-filters-close aria-label="إغلاق الفلاتر"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          </div>
        </div>
        <div class="filters__body" data-filters-body></div>
        <div class="filters__foot"><button class="btn btn--primary btn--block" type="button" data-filters-close data-apply-count>عرض النتائج</button></div>
      </aside>
      <div class="filters-backdrop" data-filters-backdrop hidden></div>

      <section aria-label="النتائج">
        <div class="toolbar">
          <p class="toolbar__count" aria-live="polite" data-count></p>
          <div class="toolbar__end">
            <button class="btn btn--ghost btn--sm filter-fab" type="button" data-filters-open><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>الفلاتر <span class="dot-count" style="position:static" data-filter-count hidden></span></button>
            <label class="sr-only" for="sort">ترتيب حسب</label>
            <select id="sort" class="select" data-sort>
              <option value="newest">الأحدث</option>
              <option value="price_asc">السعر: من الأقل</option>
              <option value="price_desc">السعر: من الأعلى</option>
              <option value="area_desc">المساحة: الأكبر</option>
              <option value="roi_desc">العائد: الأعلى</option>
            </select>
            <div class="seg" role="group" aria-label="طريقة العرض" data-views>
              <button type="button" data-v="grid" aria-pressed="true" aria-label="شبكة"></button>
              <button type="button" data-v="list" aria-pressed="false" aria-label="قائمة"></button>
              <button type="button" data-v="map" aria-pressed="false" aria-label="خريطة"></button>
            </div>
          </div>
        </div>
        <div class="active-chips" data-active></div>
        <div data-results-wrap>
          <div class="grid-cards results" data-results></div>
        </div>
        <nav class="pager" aria-label="الصفحات" data-pager></nav>
      </section>
    </div>
  </div>
</main>

<div data-footer></div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/schema.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/session.js"></script>
<script src="/assets/js/map.js"></script>
<script src="/assets/js/pages/listing.js"></script>
</body>
</html>
